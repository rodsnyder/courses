# GENERATED by Local Infrastructure/bin/sync-security-ci — do not edit in this repo.
# Source: Local Infrastructure/git-hooks/ci/security.yml (config: git-hooks/gitleaks.toml).
#
# gitleaks + Semgrep in ONE job. Until 2026-11-09 they were two workflows; GitHub bills
# every job rounded UP to the minute, so two 10-30 s jobs cost two minutes per push and
# ran the account out of included minutes (backlog c449e2a9). One job costs one minute.
#
# gitleaks (backlog c866d411): server-side backstop for the local pre-commit hook, which
# never runs for commits made off this Mac (cloud sessions, GitHub web edits, other
# machines, GITLEAKS_SKIP/--no-verify). Scans ONLY the commits each push adds; a red run
# means a secret reached GitHub and must be ROTATED, not just removed. It runs on EVERY
# push, doc-only ones included: AGENT_LOG.md and other Markdown are exactly where pasted
# command output (and so a pasted secret) lands, so no paths-ignore here.
#
# Semgrep (backlog bd0e193f): SAST in place of CodeQL, which needs a paid GitHub Advanced
# Security licence on private repos (decided against 2026-09-25). Fails only on
# ERROR-severity findings THIS push introduces (baseline mode); pre-existing findings stay
# with the weekly repo_scan.py sweep. Rules p/default, metrics off, no Semgrep account.
# Skipped when the push touched nothing but Markdown, docs/ or AGENT_LOG.md, which
# p/default never matches anyway. Both scanners report even when the other fails.
#
# bin/github-security-sync reads this workflow's failed runs by FILE NAME (security.yml)
# and classifies them by STEP NAME prefix: setup / "gitleaks: install" / "semgrep: install"
# = infra, "semgrep: scan" = SAST finding, "gitleaks: scan" or anything unknown = leak.
# Renaming a step changes what a red run means there; tests/test_sync_security_ci.py
# cross-checks the two, so change both together.
name: security

on:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commits this push added
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # BASE is the last commit already on GitHub before this push ("" for a root commit).
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && git rev-parse -q --verify "origin/${DEFAULT_BRANCH}" >/dev/null; then
            BASE="$(git merge-base "origin/${DEFAULT_BRANCH}" "$AFTER")"
          elif git rev-parse -q --verify "${AFTER}~1" >/dev/null; then
            echo "::warning::No usable base for this push (new default branch or force-push); scanning the head commit only."
            BASE="${AFTER}~1"
          else
            echo "::warning::Root commit with no parent; gitleaks scans it alone, Semgrep has nothing to diff against."
            BASE=""
          fi
          # Semgrep runs only when something other than Markdown / docs/ / AGENT_LOG.md changed.
          SEMGREP=false
          if [ -n "$BASE" ]; then
            while IFS= read -r f; do
              case "$f" in
                *.md|docs/*|AGENT_LOG.md) ;;
                *) SEMGREP=true; break ;;
              esac
            done < <(git diff --name-only "$BASE" "$AFTER")
          fi
          echo "Base: ${BASE:-<none>}  Semgrep: $SEMGREP"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "semgrep=$SEMGREP" >> "$GITHUB_OUTPUT"

      - name: "gitleaks: install 8.30.1 (checksum-pinned)"
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks

      - name: "gitleaks: scan commits added by this push"
        env:
          BASE: ${{ steps.range.outputs.base }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then RANGE="${BASE}..${AFTER}"; else RANGE="-1 ${AFTER}"; fi
          echo "Scanning: $RANGE"
          ./gitleaks git --redact --no-banner --exit-code 1 --config .github/gitleaks.toml --log-opts="$RANGE" .

      # !cancelled(): still run when gitleaks failed, so a leak never hides a SAST finding.
      - name: "semgrep: install 1.170.0 (version-pinned)"
        if: ${{ steps.range.outputs.semgrep == 'true' && !cancelled() }}
        run: pipx install semgrep==1.170.0

      - name: "semgrep: scan changes added by this push"
        if: ${{ steps.range.outputs.semgrep == 'true' && !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          echo "Baseline: $BASE"
          semgrep scan --config p/default --metrics=off --disable-version-check \
            --severity ERROR --error --baseline-commit "$BASE" .
